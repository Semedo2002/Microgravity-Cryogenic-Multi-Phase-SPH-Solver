<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryoSPH Viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #dde1e8; --accent: #2a6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #98a1b3; --line: #2a303c; --accent: #6ea1ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #98a1b3; --line: #2a303c; --accent: #6ea1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 290px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  main { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 10px 12px; }
  legend { color: var(--muted); font-size: 12px; padding: 0 4px; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  select, input[type="text"], button { font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type="text"] { width: 100%; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  .stat { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; margin: 3px 0; }
  .stat span:first-child { color: var(--muted); }
  #colorbar { height: 10px; border-radius: 3px; margin-top: 6px; }
  .cbl { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); padding: 24px; pointer-events: none; }
  #hud { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(320px, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 48vh; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>CryoSPH Viewer</h1>
    <div class="sub" id="title">No data loaded</div>

    <fieldset>
      <legend>Data</legend>
      <label style="display:block">Manifest URL
        <input type="text" id="url" value="../out/boiloff/manifest.json" spellcheck="false">
      </label>
      <div class="row">
        <button class="primary" id="load">Load</button>
        <button id="pick">Open folder…</button>
        <input type="file" id="dir" webkitdirectory multiple hidden>
      </div>
    </fieldset>

    <fieldset>
      <legend>Playback</legend>
      <div class="row">
        <button id="play" aria-label="Play">▶</button>
        <input type="range" id="frame" min="0" max="0" value="0" aria-label="Frame">
      </div>
      <label>Speed <input type="range" id="fps" min="1" max="60" value="15"> <span id="fpsv">15</span> fps</label>
      <label><input type="checkbox" id="loop" checked> Loop</label>
    </fieldset>

    <fieldset>
      <legend>Display</legend>
      <label>Colour by
        <select id="field">
          <option value="temperature">Temperature</option>
          <option value="pressure">Pressure</option>
          <option value="speed">Speed</option>
          <option value="phase">Phase</option>
        </select>
      </label>
      <label><input type="checkbox" id="showL" checked> Liquid</label>
      <label><input type="checkbox" id="showV" checked> Vapour</label>
      <label><input type="checkbox" id="showW"> Walls (if exported)</label>
      <label>Point size <input type="range" id="size" min="1" max="12" value="4"></label>
      <label><input type="checkbox" id="lockRange"> Lock colour range</label>
      <div id="colorbar"></div>
      <div class="cbl"><span id="cmin">–</span><span id="cmax">–</span></div>
    </fieldset>

    <fieldset>
      <legend>Frame</legend>
      <div class="stat"><span>Time</span><span id="sT">–</span></div>
      <div class="stat"><span>Step</span><span id="sS">–</span></div>
      <div class="stat"><span>Particles</span><span id="sN">–</span></div>
      <div class="stat"><span>Liquid / vapour</span><span id="sLV">–</span></div>
      <div class="stat"><span>Mean liquid T</span><span id="sTl">–</span></div>
      <div class="stat"><span>Max speed</span><span id="sV">–</span></div>
    </fieldset>
  </aside>
  <main>
    <canvas id="view"></canvas>
    <div id="msg">Load a manifest written by the examples (serve the repository with
      <code>python -m http.server</code>), or open an output folder.</div>
    <div id="hud"></div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const canvas = $("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 1e-4, 100);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

const geom = new THREE.BufferGeometry();
const material = new THREE.PointsMaterial({ size: 4, sizeAttenuation: false, vertexColors: true });
const points = new THREE.Points(geom, material);
scene.add(points);
const box = new THREE.Box3Helper(new THREE.Box3(), 0x888888);
box.visible = false;
scene.add(box);

// ---------------------------------------------------------------- theme --
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function applyTheme() { scene.background = new THREE.Color(cssVar("--bg")); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
applyTheme();

// ------------------------------------------------------------- colormaps --
// Perceptually ordered blue -> teal -> yellow -> red ramp.
const RAMP = [[0.19, 0.30, 0.68], [0.16, 0.56, 0.72], [0.38, 0.74, 0.55], [0.93, 0.80, 0.35], [0.85, 0.30, 0.20]];
function ramp(t) {
  t = Math.min(1, Math.max(0, t)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i, a = RAMP[i], b = RAMP[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
const PHASE_COL = [[0.16, 0.44, 0.86], [0.92, 0.55, 0.25], [0.55, 0.57, 0.62]];
$("colorbar").style.background =
  `linear-gradient(90deg, ${RAMP.map((c) => `rgb(${c.map((v) => Math.round(v * 255)).join(",")})`).join(",")})`;

// ------------------------------------------------------------------ data --
let frames = [];          // [{time, file}] or [{time, blob}]
let cache = new Map();    // index -> parsed frame
let current = -1, playing = false, lastTick = 0, locked = null, framed = false;
let source = null;        // {kind: "url", base} | {kind: "files", map}

function setMsg(text) { $("msg").textContent = text; $("msg").style.display = text ? "flex" : "none"; }

async function fetchJson(name) {
  if (source.kind === "url") {
    const r = await fetch(new URL(name, source.base));
    if (!r.ok) throw new Error(`${r.status} ${r.statusText} for ${name}`);
    return r.json();
  }
  const f = source.map.get(name);
  if (!f) throw new Error(`missing file ${name}`);
  return JSON.parse(await f.text());
}

async function openManifest(manifest) {
  frames = manifest.frames || [];
  cache = new Map();
  current = -1;
  framed = false;
  locked = null;
  $("title").textContent = `${manifest.title || "Untitled run"} — ${frames.length} frames`;
  $("frame").max = Math.max(0, frames.length - 1);
  $("frame").value = 0;
  if (!frames.length) { setMsg("The manifest lists no frames."); return; }
  setMsg("");
  await show(0);
}

$("load").onclick = async () => {
  try {
    const url = new URL($("url").value, location.href);
    source = { kind: "url", base: url };
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    await openManifest(await r.json());
  } catch (e) { setMsg(`Could not load manifest: ${e.message}`); }
};
$("pick").onclick = () => $("dir").click();
$("dir").onchange = async (ev) => {
  const map = new Map();
  for (const f of ev.target.files) map.set(f.name, f);
  source = { kind: "files", map };
  try {
    if (map.has("manifest.json")) {
      await openManifest(JSON.parse(await map.get("manifest.json").text()));
    } else {
      const names = [...map.keys()].filter((n) => /^frame_\d+\.json$/.test(n)).sort();
      await openManifest({ title: "Local frames", frames: names.map((file) => ({ file })) });
    }
  } catch (e) { setMsg(`Could not read folder: ${e.message}`); }
};

async function getFrame(i) {
  if (!cache.has(i)) {
    cache.set(i, fetchJson(frames[i].file));
    if (cache.size > 64) cache.delete(cache.keys().next().value);
  }
  return cache.get(i);
}

// --------------------------------------------------------------- display --
function rangeOf(arr, mask) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < arr.length; i++) if (mask[i]) { const v = arr[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!isFinite(lo)) return [0, 1];
  if (hi - lo < 1e-9) { lo -= 0.5; hi += 0.5; }
  return [lo, hi];
}
function fmt(v) { return Math.abs(v) >= 1e4 || (Math.abs(v) < 1e-2 && v !== 0) ? v.toExponential(2) : v.toFixed(3); }

let lastFrame = null;
function render(fr) {
  lastFrame = fr;
  const n = fr.n, show = [$("showL").checked, $("showV").checked, $("showW").checked];
  const mask = new Uint8Array(n);
  let m = 0;
  for (let i = 0; i < n; i++) if (show[fr.phase[i]] ?? false) { mask[i] = 1; m++; }
  const pos = new Float32Array(3 * m), col = new Float32Array(3 * m);
  const field = $("field").value;
  let lo = 0, hi = 1;
  if (field !== "phase") {
    [lo, hi] = $("lockRange").checked && locked && locked.field === field ? locked.range : rangeOf(fr[field], mask);
    locked = { field, range: [lo, hi] };
    $("cmin").textContent = fmt(lo); $("cmax").textContent = fmt(hi);
  } else { $("cmin").textContent = "liquid"; $("cmax").textContent = "vapour"; }
  for (let i = 0, k = 0; i < n; i++) {
    if (!mask[i]) continue;
    pos[3 * k] = fr.position[3 * i]; pos[3 * k + 1] = fr.position[3 * i + 1]; pos[3 * k + 2] = fr.position[3 * i + 2];
    const c = field === "phase" ? PHASE_COL[fr.phase[i]] : ramp((fr[field][i] - lo) / (hi - lo));
    col[3 * k] = c[0]; col[3 * k + 1] = c[1]; col[3 * k + 2] = c[2];
    k++;
  }
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geom.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geom.computeBoundingSphere();
  if (!framed && m > 0) {
    geom.computeBoundingBox();
    const bb = geom.boundingBox, c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length();
    controls.target.copy(c);
    camera.position.set(c.x + 1.2 * r, c.y - 1.4 * r, c.z + 0.8 * r);
    camera.near = r * 1e-3; camera.far = r * 50; camera.updateProjectionMatrix();
    box.box.copy(bb); box.visible = true;
    framed = true;
  }
  // stats
  let nl = 0, nv = 0, tl = 0, vmax = 0;
  for (let i = 0; i < n; i++) {
    if (fr.phase[i] === 0) { nl++; tl += fr.temperature[i]; } else if (fr.phase[i] === 1) nv++;
    if (fr.phase[i] < 2 && fr.speed[i] > vmax) vmax = fr.speed[i];
  }
  $("sT").textContent = `${fr.time.toFixed(4)} s`;
  $("sS").textContent = fr.step;
  $("sN").textContent = n.toLocaleString();
  $("sLV").textContent = `${nl.toLocaleString()} / ${nv.toLocaleString()}`;
  $("sTl").textContent = nl ? `${(tl / nl).toFixed(3)} K` : "–";
  $("sV").textContent = `${vmax.toFixed(3)} m/s`;
  $("hud").textContent = `frame ${current + 1} / ${frames.length}`;
}

async function show(i) {
  if (i < 0 || i >= frames.length) return;
  current = i;
  $("frame").value = i;
  try {
    const fr = await getFrame(i);
    if (current === i) render(fr);
    getFrame(Math.min(frames.length - 1, i + 1)).catch(() => {});  // prefetch
  } catch (e) { setMsg(`Frame ${i}: ${e.message}`); playing = false; $("play").textContent = "▶"; }
}

$("frame").oninput = (e) => show(+e.target.value);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; };
$("fps").oninput = (e) => { $("fpsv").textContent = e.target.value; };
$("size").oninput = (e) => { material.size = +e.target.value; };
for (const id of ["field", "showL", "showV", "showW", "lockRange"]) $(id).onchange = () => lastFrame && render(lastFrame);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowRight") show(Math.min(frames.length - 1, current + 1));
  if (e.key === "ArrowLeft") show(Math.max(0, current - 1));
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }
}
function tick(t) {
  resize();
  if (playing && frames.length && t - lastTick > 1000 / +$("fps").value) {
    lastTick = t;
    const next = current + 1;
    if (next < frames.length) show(next);
    else if ($("loop").checked) show(0);
    else { playing = false; $("play").textContent = "▶"; }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const q = new URLSearchParams(location.search).get("manifest");
if (q) { $("url").value = q; $("load").click(); }
</script>
</body>
</html>
