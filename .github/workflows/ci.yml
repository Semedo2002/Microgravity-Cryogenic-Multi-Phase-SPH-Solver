name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    name: CPU backend (OpenMP) - build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgtest-dev pybind11-dev python3-dev python3-numpy python3-pytest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRYOSPH_ENABLE_CUDA=OFF -DCRYOSPH_FETCH_DEPENDENCIES=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure --timeout 1800
      - name: Python tests
        run: PYTHONPATH=build/python python3 -m pytest tests/python -q

  cuda-compile:
    name: CUDA backend - compile only (no GPU on hosted runners)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgtest-dev pybind11-dev python3-dev
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRYOSPH_ENABLE_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES="75;86" -DCRYOSPH_FETCH_DEPENDENCIES=OFF
          cmake --build build -j 4

